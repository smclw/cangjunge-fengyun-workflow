name: Bug 报告
description: 提交可复现的功能、数据或 Windows 兼容问题
title: "[Bug] "
labels: [bug, needs-triage]
body:
  - type: markdown
    attributes:
      value: 感谢反馈。请勿提交密码、Token、Cookie、真实客户数据或未授权素材。
  - type: input
    id: version
    attributes:
      label: 版本或提交
      placeholder: 例如 v0.1.0 或 commit SHA
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: 运行环境
      placeholder: Windows 11、Node.js 22.23.1、Chrome 版本
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
      description: 使用演示或脱敏数据，写出最小稳定复现步骤。
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 期望结果
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: 实际结果
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: 日志或截图
      description: 请先删除本地路径、个人信息、凭据和真实经营数据。
  - type: checkboxes
    id: safety
    attributes:
      label: 提交确认
      options:
        - label: 我已搜索现有 Issue，且没有提交敏感信息或未授权内容。
          required: true
