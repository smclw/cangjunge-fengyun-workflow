name: 功能建议
description: 提议一个有明确用户价值和验收标准的改进
title: "[Feature] "
labels: [enhancement, needs-triage]
body:
  - type: textarea
    id: problem
    attributes:
      label: 要解决的问题
      description: 谁在什么场景下遇到了什么问题？
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 建议方案
      description: 描述最小完整方案，不要只写技术名称。
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 替代方案
      description: 你考虑过哪些更简单或风险更低的做法？
  - type: textarea
    id: acceptance
    attributes:
      label: 验收标准
      description: 如何客观判断功能已经完成且没有破坏现有数据？
    validations:
      required: true
  - type: checkboxes
    id: boundaries
    attributes:
      label: 安全边界
      options:
        - label: 方案不会绕过账号登录、付费调用、正式发布或真实数据处理的人工授权。
          required: true
